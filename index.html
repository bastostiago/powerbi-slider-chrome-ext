<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Power Slider</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" data-link="home">
        <img src="img/icon_enabled_128.png" alt="" width="28" height="28" />
        <span>Power Slider</span>
      </a>
      <a class="icon-button" data-link="help" data-i18n-attr="aria-label:help">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 5.25h.008v.008H12v-.008Z" />
        </svg>
      </a>
    </header>

    <main>
      <!-- Power BI report open: ready to present -->
      <section class="view" data-view="report" hidden>
        <div class="report-card">
          <div class="report-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3v11.25A2.25 2.25 0 0 0 6 16.5h2.25M3.75 3h-1.5m1.5 0h16.5m0 0h1.5m-1.5 0v11.25A2.25 2.25 0 0 1 18 16.5h-2.25m-7.5 0h7.5m-7.5 0-1 3m8.5-3 1 3m0 0 .5 1.5m-.5-1.5h-9.5m0 0-.5 1.5m.75-9 3-3 2.148 2.148A12.061 12.061 0 0 1 16.5 7.605" />
            </svg>
          </div>
          <div class="report-text">
            <p class="eyebrow"><span class="live-dot"></span><span data-i18n="reportDetected"></span></p>
            <h1 id="reportName"></h1>
            <p class="meta" id="myWorkspace" data-i18n="myWorkspace" hidden></p>
          </div>
        </div>
        <button class="btn btn-primary" id="startButton">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M7 4.8v14.4a1 1 0 0 0 1.52.85l11.5-7.2a1 1 0 0 0 0-1.7L8.52 3.95A1 1 0 0 0 7 4.8Z" />
          </svg>
          <span data-i18n="actionButton"></span>
        </button>
        <div class="hint">
          <p data-i18n="actionHint"></p>
          <p id="shortcut" hidden><span data-i18n="shortcutLabel"></span> <kbd></kbd></p>
        </div>
      </section>

      <!-- Report opened through a Power BI App -->
      <section class="view" data-view="appReport" hidden>
        <div class="empty">
          <div class="empty-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z" />
            </svg>
          </div>
          <h1 data-i18n="appReportTitle"></h1>
          <p data-i18n="appReportText"></p>
        </div>
      </section>

      <!-- Power BI open, but not on a report -->
      <section class="view" data-view="powerbi" hidden>
        <div class="empty">
          <div class="empty-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m5.231 13.481L15 17.25m-4.5-15H5.625c-.621 0-1.125.504-1.125 1.125v16.5c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Zm3.75 11.625a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z" />
            </svg>
          </div>
          <h1 data-i18n="openReportTitle"></h1>
          <p data-i18n="openReportText"></p>
        </div>
      </section>

      <!-- On the Power Slider site -->
      <section class="view" data-view="slider" hidden>
        <div class="empty">
          <div class="empty-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09ZM18.259 8.715 18 9.75l-.259-1.035a3.375 3.375 0 0 0-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 0 0 2.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 0 0 2.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 0 0-2.456 2.456Z" />
            </svg>
          </div>
          <h1 data-i18n="welcomeTitle"></h1>
          <p data-i18n="welcomeText"></p>
        </div>
        <a class="btn btn-secondary" data-link="help" data-i18n="howItWorks"></a>
      </section>

      <!-- Any other site: onboarding -->
      <section class="view" data-view="other" hidden>
        <h1 data-i18n="getStartedTitle"></h1>
        <ol class="steps">
          <li><span data-i18n="step1"></span></li>
          <li><span data-i18n="step2"></span></li>
          <li><span data-i18n="step3"></span></li>
        </ol>
        <a class="btn btn-primary" data-link="powerBi">
          <span data-i18n="openPowerBi"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 0 0 3 8.25v10.5A2.25 2.25 0 0 0 5.25 21h10.5A2.25 2.25 0 0 0 18 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25" />
          </svg>
        </a>
      </section>
    </main>

    <section class="recents" id="recents" hidden>
      <div class="recents-head">
        <h2 data-i18n="recentTitle"></h2>
        <button class="link-button" id="clearRecents" data-i18n="clearRecents"></button>
      </div>
      <ul id="recentList"></ul>
    </section>
    <template id="recentItem">
      <li>
        <button class="recent">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M7 4.8v14.4a1 1 0 0 0 1.52.85l11.5-7.2a1 1 0 0 0 0-1.7L8.52 3.95A1 1 0 0 0 7 4.8Z" />
          </svg>
          <span class="recent-name"></span>
          <span class="recent-time"></span>
        </button>
      </li>
    </template>

    <a class="tip" data-link="compositions">
      <div class="tip-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6.429 9.75 2.25 12l4.179 2.25m0-4.5 5.571 3 5.571-3m-11.142 0L2.25 7.5 12 2.25l9.75 5.25-4.179 2.25m0 0L21.75 12l-4.179 2.25m0 0 4.179 2.25L12 21.75 2.25 16.5l4.179-2.25m11.142 0-5.571 3-5.571-3" />
        </svg>
      </div>
      <div>
        <p data-i18n="compositionsMessage"></p>
        <strong data-i18n="compositionsTitle"></strong>
      </div>
      <svg class="tip-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
      </svg>
    </a>

    <footer>
      <nav>
        <a data-link="terms" data-i18n="terms"></a>
        <span aria-hidden="true">·</span>
        <a data-link="privacy" data-i18n="privacy"></a>
      </nav>
      <span id="version"></span>
      <p class="disclaimer" data-i18n="disclaimer"></p>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
